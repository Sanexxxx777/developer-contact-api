limit_req_zone $binary_remote_addr zone=developer_contact_rate:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=developer_contact_conn:10m;

map $request_uri $developer_contact_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests";
    ~^/docs(?:/|$) "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'none'";
}
