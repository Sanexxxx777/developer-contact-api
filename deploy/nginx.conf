server {
    listen 80;
    listen [::]:80;
    server_name backend-test.45-82-95-142.nip.io;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location / { return 301 https://$host:8443$request_uri; }
}

server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name backend-test.45-82-95-142.nip.io;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/backend-test.45-82-95-142.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend-test.45-82-95-142.nip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/cf-security-headers.conf;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy $developer_contact_csp always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;

    location = /api/contact {
        limit_req zone=developer_contact_rate burst=3 nodelay;
        limit_req_status 429;
        limit_conn developer_contact_conn 3;
        limit_conn_status 429;
        include snippets/developer-contact-proxy.conf;
    }

    location = /api/metrics {
        return 404;
    }

    location / {
        include snippets/developer-contact-proxy.conf;
    }
}
