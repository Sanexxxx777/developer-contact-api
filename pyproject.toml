[project]
name = "developer-contact-api"
version = "1.0.0"
description = "Backend-first developer landing page with resilient AI-assisted contact processing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aiosmtplib>=3.0,<5.0",
  "email-validator>=2.1,<3.0",
  "fastapi>=0.115,<1.0",
  "openai>=1.68,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.7,<3.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "ruff>=0.11,<1.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
